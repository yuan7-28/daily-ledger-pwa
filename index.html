<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="日用小账本"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/cat-launcher.png"><link rel="stylesheet" href="style.css"><title>日用小账本</title></head><body><main id="app"><section id="ledger-page" class="page active"><header><img src="assets/cat-launcher.png" class="cat" alt="猫猫图标"><div><p>MY LITTLE LEDGER</p><h1>日用小账本</h1><small>每天用到才记录，用完才结算。</small></div></header><section class="summary"><article class="peach"><small>今天使用成本</small><strong id="today-cost">¥0.00</strong><span id="today-note">今天还没有记录</span></article><article class="mint"><small>本月已摊销</small><strong id="month-cost">¥0.00</strong><span>按真实使用日结算</span></article></section><section class="card"><div class="heading"><h2>今天用什么了？</h2><span id="today-label"></span></div><div id="usage-list"></div><p id="empty-usage" class="empty">还没有使用中的物品 🌷<br><small>点击右下角添加第一件东西</small></p></section><section><div class="heading"><h2>使用中的物品</h2><span id="active-count"></span></div><div id="active-list" class="item-list"></div></section><section id="finished-section" hidden><div class="heading"><h2>已用完</h2></div><div id="finished-list" class="item-list"></div></section></section><section id="calendar-page" class="page"><header class="calendar-head"><div><p>MONTHLY VIEW</p><h1>月历统计</h1><small>每天的实际成本，清清楚楚。</small></div></header><section class="card calendar-card"><div class="month-nav"><button id="prev-month" aria-label="上个月">‹</button><div><h2 id="month-title"></h2><small id="month-average"></small></div><button id="next-month" aria-label="下个月">›</button></div><div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar-grid"></div><p class="calendar-note">有色日期显示当天总成本 · 日均 = 月总成本 ÷ 有记录天数</p></section><section><div class="heading"><h2>使用历史</h2></div><div id="history-list"></div></section></section></main><button id="add-button" class="add">＋ 添加物品</button><nav><button class="tab selected" data-page="ledger-page"><b>账</b><span>我的账本</span></button><button class="tab" data-page="calendar-page"><b>历</b><span>月历统计</span></button></nav><dialog id="add-dialog"><form method="dialog"><button class="close" value="cancel">×</button><p>NEW ITEM</p><h2>添加一件东西</h2><label>物品名称<input id="item-name" required maxlength="30" placeholder="例如：护肤精华、咖啡豆"></label><label>购买金额（元）<input id="item-price" required type="number" min="0.01" step="0.01" placeholder="30.00"></label><small>每天实际使用时再打勾；点击“用完”后，自动按真实使用天数计算日均成本。</small><button id="save-item" value="default">保存到小账本</button></form></dialog><template id="item-template"><article class="item"><div><h3></h3><p class="item-meta"></p></div><button class="more">用完</button><div class="cost-row"><strong></strong><span></span></div></article></template><script src="app.js"></script></body></html>
